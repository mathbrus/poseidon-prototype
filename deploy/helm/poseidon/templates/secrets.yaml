# Secrets layout: each credential exists only in the namespace
# of the one service allowed to mount it.
#   git-credentials   (platform)  -> mcp-gateway only
#   llm-credentials   (platform)  -> llm-proxy only
#   egress-proxy-key  (platform)  -> egress-proxy + orchestrator worker (the
#                                    shared HMAC key of the per-run
#                                    credential; sandboxes only ever see
#                                    their own derived credential)
apiVersion: v1
kind: Secret
metadata:
  name: git-credentials
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
type: Opaque
stringData:
  GIT_TOKEN: {{ required "secrets.gitToken is required (set it via a values override; deploy/kind/kind-up.sh supplies it from .env)" .Values.secrets.gitToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: llm-credentials
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
type: Opaque
stringData:
  # LLM_API_KEY is provider-agnostic by contract; LiteLLM reads
  # provider-specific names, so the key is exposed under every provider name
  # the model may imply — LiteLLM only reads the one matching the prefix.
  OPENAI_API_KEY: {{ required "secrets.llmApiKey is required (set it via a values override)" .Values.secrets.llmApiKey | quote }}
  ANTHROPIC_API_KEY: {{ required "secrets.llmApiKey is required (set it via a values override)" .Values.secrets.llmApiKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: egress-proxy-key
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
type: Opaque
stringData:
  EGRESS_PROXY_KEY: {{ required "secrets.egressProxyKey is required (set it via a values override)" .Values.secrets.egressProxyKey | quote }}
