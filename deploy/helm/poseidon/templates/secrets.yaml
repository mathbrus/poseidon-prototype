# Secrets layout (plan step 1a): each credential exists only in the namespace
# of the one service allowed to mount it.
#   git-credentials   (platform)  -> mcp-gateway only
#   llm-credentials   (platform)  -> llm-proxy only
#   egress-proxy-key  (platform)  -> egress-proxy + orchestrator worker (the
#                                    shared HMAC key of the §2b per-run
#                                    credential; sandboxes only ever see
#                                    their own derived credential)
#   platform-jwt-key  (platform)  -> both gateways (verify) + the
#                                    orchestrator worker (mint, step 16a)
apiVersion: v1
kind: Secret
metadata:
  name: git-credentials
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
type: Opaque
stringData:
  GIT_TOKEN: {{ .Values.secrets.gitToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: llm-credentials
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
type: Opaque
stringData:
  # LLM_API_KEY is provider-agnostic in the contract (C7); LiteLLM reads
  # provider-specific names, so the key is exposed under every provider name
  # the model may imply — LiteLLM only reads the one matching the prefix.
  OPENAI_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: egress-proxy-key
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
type: Opaque
stringData:
  EGRESS_PROXY_KEY: {{ .Values.secrets.egressProxyKey | quote }}
---
# The §2b platform signing key: the gateways verify platform-signed
# ephemeral JWTs with it (step 11); the orchestrator worker mints them
# (step 16a). Platform namespace only — nothing a company pod can read
# allows minting an identity.
apiVersion: v1
kind: Secret
metadata:
  name: platform-jwt-key
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
type: Opaque
stringData:
  PLATFORM_JWT_KEY: {{ .Values.secrets.platformJwtKey | quote }}
