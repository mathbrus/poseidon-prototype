# The LLM gateway (plan step 14): the workload-authenticated, metered,
# tier-routing route to any model. Verifies the same projected tokens as
# the MCP gateway (TokenReview -> auth-delegator); holds no provider keys —
# the upstream llm-proxy does, and NetworkPolicy seals it so nothing but
# this gateway reaches it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-gateway
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: poseidon-llm-gateway-auth-delegator
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: llm-gateway
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-gateway
  template:
    metadata:
      labels:
        app: llm-gateway
        {{- include "poseidon.labels" . | nindent 8 }}
    spec:
      serviceAccountName: llm-gateway
      enableServiceLinks: false
      containers:
        - name: llm-gateway
          image: "{{ .Values.images.gatewayLlm.repository }}:{{ .Values.images.gatewayLlm.tag }}"
          imagePullPolicy: {{ .Values.images.gatewayLlm.pullPolicy }}
          ports:
            - containerPort: 4000
          env:
            - name: PLATFORM_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: PLATFORM_JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-jwt-key
                  key: PLATFORM_JWT_KEY
            - name: REGISTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: registry-credentials
                  key: REGISTRY_DSN
            - name: UPSTREAM_URL
              value: http://llm-proxy:4000
            # tier -> model resolution (§4.8): the blueprint names tiers,
            # only the deployment knows which concrete model a tier means.
            - name: TIER_MODELS
              value: {{ .Values.llmGateway.tierModels | toJson | quote }}
            - name: DEFAULT_MODEL
              value: {{ .Values.run.model | quote }}
            - name: PRICE_PER_1K_TOKENS
              value: {{ .Values.llmGateway.pricePer1kTokens | quote }}
          readinessProbe:
            httpGet: {path: /healthz, port: 4000}
            periodSeconds: 5
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 4000}
            periodSeconds: 10
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
spec:
  selector:
    app: llm-gateway
  ports:
    - port: 4000
      targetPort: 4000
