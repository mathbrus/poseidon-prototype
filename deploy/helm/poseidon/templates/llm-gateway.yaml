# The LLM gateway: the workload-authenticated, metered,
# tier-routing route to any model. Verifies the same projected tokens as
# the MCP gateway (TokenReview -> auth-delegator); holds no provider keys —
# the upstream llm-proxy does, and NetworkPolicy seals it so nothing but
# this gateway reaches it.
{{ include "poseidon.authDelegator" (dict "root" . "name" "llm-gateway") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-gateway
  template:
    metadata:
      labels:
        app: llm-gateway
        {{- include "poseidon.labels" . | nindent 8 }}
    spec:
      serviceAccountName: llm-gateway
      enableServiceLinks: false
      securityContext:
        {{- include "poseidon.podSecurityContext" . | nindent 8 }}
      volumes:
        {{- include "poseidon.scratchVolume" . | nindent 8 }}
      containers:
        - name: llm-gateway
          image: "{{ .Values.images.llmGateway.repository }}:{{ .Values.images.llmGateway.tag }}"
          imagePullPolicy: {{ .Values.images.llmGateway.pullPolicy }}
          securityContext:
            {{- include "poseidon.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "poseidon.scratchMount" . | nindent 12 }}
          ports:
            - containerPort: 4000
          env:
            - name: PLATFORM_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- include "poseidon.registryDsnEnv" . | nindent 12 }}
            - name: UPSTREAM_URL
              value: http://llm-proxy:4000
            # tier -> model resolution: the blueprint names tiers,
            # only the deployment knows which concrete model a tier means.
            - name: TIER_MODELS
              value: {{ .Values.llmGateway.tierModels | toJson | quote }}
            - name: DEFAULT_MODEL
              value: {{ .Values.run.model | quote }}
            - name: PRICE_PER_1K_TOKENS
              value: {{ .Values.llmGateway.pricePer1kTokens | quote }}
          readinessProbe:
            httpGet: {path: /healthz, port: 4000}
            periodSeconds: 5
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 4000}
            periodSeconds: 10
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
spec:
  selector:
    app: llm-gateway
  ports:
    - port: 4000
      targetPort: 4000
