{{- if .Values.networkPolicies.enabled }}
# NetworkPolicy hardening (plan step 1c) — replaces the four Compose
# networks. Requires a CNI that enforces NetworkPolicy (kind's default CNI
# does not; the bootstrap installs Calico).
#
#   company namespace: default deny (ingress+egress) for every pod;
#     agent egress only to mcp-gateway, llm-proxy and cluster DNS;
#     agent ingress only for the host-side runner's dispatch/status calls;
#     sandbox Jobs (plan step 4/5): ingress from the gateway only; egress
#     only to the egress proxy and cluster DNS — the proxy enforces the
#     audited allowlist, this policy stays the silent backstop beneath it.
#     The workspace tar arrives over the exec API, not the pod network.
#   platform namespace: gateway egress restricted to OPA, DNS, the sandbox
#     toolservers in the company namespace, and non-cluster addresses (the
#     external git host).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Values.companyNamespace }}
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-egress
  namespace: {{ .Values.companyNamespace }}
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: agent
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app: mcp-gateway
      ports:
        - port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app: llm-proxy
      ports:
        - port: 4000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-ingress-runner
  namespace: {{ .Values.companyNamespace }}
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: agent
  policyTypes: [Ingress]
  ingress:
    # The orchestrator worker's dispatch/status calls.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app: orchestrator-worker
      ports:
        - port: 8000
    # Host-side callers (bootstrap smoke, e2e stack check) via NodePort.
    - from:
        {{- range .Values.networkPolicies.runnerIngressCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: 8000
---
# Sandbox Jobs: the toolserver answers the gateway and nobody else; egress
# reaches only the audited proxy (plus DNS to resolve it) — every other
# destination is silently dropped here as the backstop beneath the proxy's
# audited denies. Hand-authored until the compiler emits it from the infra
# IR (step 12).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-isolation
  namespace: {{ .Values.companyNamespace }}
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: poseidon-sandbox
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app: mcp-gateway
      ports:
        - port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app: egress-proxy
      ports:
        - port: 3128
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# The egress proxy answers sandboxes and nobody else (the kubelet's probes
# bypass NetworkPolicy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-proxy-ingress
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: egress-proxy
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.companyNamespace }}
          podSelector:
            matchLabels:
              app: poseidon-sandbox
      ports:
        - port: 3128
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-egress
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: mcp-gateway
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: opa
      ports:
        - port: 8181
    # The sandbox.* proxy path: gateway -> toolserver pods (plan step 4).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.companyNamespace }}
          podSelector:
            matchLabels:
              app: poseidon-sandbox
      ports:
        - port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Everything outside the cluster: the external git host. Pods and
    # services are explicitly excluded so "external" never quietly
    # includes them.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range .Values.networkPolicies.clusterCidrs }}
              - {{ . }}
              {{- end }}
{{- end }}
