# The orchestrator worker: drives the workflows through Temporal.
# Credentials: the egress-proxy HMAC key and the registry DSN — no
# GIT_TOKEN, no provider keys. Its gateway identity is a projected
# service-account token, audience-scoped to the gateway and
# rotated by the kubelet; the same ServiceAccount carries the bounded
# sandbox-provisioner Role (orchestrator-rbac.yaml) for the k8s_jobs
# backend. Run records live in the registry, so
# there is no runs PVC to manage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-worker
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator-worker
  template:
    metadata:
      labels:
        app: orchestrator-worker
        {{- include "poseidon.labels" . | nindent 8 }}
    spec:
      serviceAccountName: orchestrator-worker
      securityContext:
        {{- include "poseidon.podSecurityContext" . | nindent 8 }}
      volumes:
        # Audience-scoped gateway identity — distinct from
        # the automounted API-server token the k8s_jobs backend uses; this
        # one is useless at the API server and the API one at the gateway.
        - name: gateway-identity
          projected:
            sources:
              - serviceAccountToken:
                  audience: poseidon-mcp-gateway
                  expirationSeconds: 3600
                  path: token
        {{- include "poseidon.scratchVolume" . | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.images.orchestrator.repository }}:{{ .Values.images.orchestrator.tag }}"
          imagePullPolicy: {{ .Values.images.orchestrator.pullPolicy }}
          securityContext:
            {{- include "poseidon.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: gateway-identity
              mountPath: /var/run/poseidon/identity
              readOnly: true
            {{- include "poseidon.scratchMount" . | nindent 12 }}
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.orchestrator.temporalAddress | quote }}
            - name: TIMEOUT_PROFILE
              value: {{ .Values.orchestrator.timeoutProfile | quote }}
            - name: MCP_GATEWAY_URL
              value: http://mcp-gateway:8080
            # The workflow-recorded crew request evaluates
            # the same compiled decision the crew.request tool faces,
            # directly at OPA.
            - name: OPA_URL
              value: http://opa:8181
            - name: GATEWAY_TOKEN_FILE
              value: /var/run/poseidon/identity/token
            - name: COMPANY
              value: {{ .Values.company | quote }}
            # Deploy-time resolution of the infra IR's logical toolchain
            # image (content-addressed on kind); every other SandboxPolicy
            # value comes from the applied blueprint.
            - name: SANDBOX_IMAGE
              value: {{ .Values.orchestrator.sandbox.image | quote }}
            # Ephemeral pods run the agent image; the worker
            # resolves gateway FQDNs from the platform namespace.
            - name: AGENT_IMAGE
              value: "{{ .Values.images.agent.repository }}:{{ .Values.images.agent.tag }}"
            - name: PLATFORM_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: MODEL
              value: {{ .Values.run.model | quote }}
            - name: VERIFY_CYCLES
              value: {{ .Values.run.verifyCycles | quote }}
            # Egress attribution: the proxy URL as sandboxes resolve
            # it, and the shared key to mint their per-run credentials.
            - name: EGRESS_PROXY_URL
              value: http://egress-proxy.{{ .Release.Namespace }}.svc.cluster.local:3128
            - name: EGRESS_PROXY_KEY
              valueFrom:
                secretKeyRef:
                  name: egress-proxy-key
                  key: EGRESS_PROXY_KEY
            {{- include "poseidon.registryDsnEnv" . | nindent 12 }}
