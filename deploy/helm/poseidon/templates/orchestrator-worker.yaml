# The orchestrator worker (plan step 3): drives implement through Temporal.
# Credentials: the orchestrator bearer token only — no GIT_TOKEN, no
# provider keys. Its ServiceAccount carries the bounded sandbox-provisioner
# Role (orchestrator-rbac.yaml) for the k8s_jobs backend (plan step 4).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orchestrator-runs
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.orchestrator.runs.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.orchestrator.runs.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-worker
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate: the runs PVC is ReadWriteOnce.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: orchestrator-worker
  template:
    metadata:
      labels:
        app: orchestrator-worker
        {{- include "poseidon.labels" . | nindent 8 }}
    spec:
      serviceAccountName: orchestrator-worker
      containers:
        - name: worker
          image: "{{ .Values.images.orchestrator.repository }}:{{ .Values.images.orchestrator.tag }}"
          imagePullPolicy: {{ .Values.images.orchestrator.pullPolicy }}
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.orchestrator.temporalAddress | quote }}
            - name: MCP_GATEWAY_URL
              value: http://mcp-gateway:8080
            - name: AGENT_URL
              value: http://agent.{{ .Values.companyNamespace }}.svc.cluster.local:8000
            - name: ORCHESTRATOR_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bearer-tokens
                  # Successor of the runner token: same identity at the
                  # gateway until workload JWTs land (plan step 12).
                  key: RUNNER_BEARER_TOKEN
            - name: TARGET_REPO
              value: {{ .Values.run.targetRepo | quote }}
            - name: BASE_REF
              value: {{ .Values.run.baseRef | quote }}
            - name: SANDBOX_NAMESPACE
              value: {{ .Values.companyNamespace | quote }}
            - name: SANDBOX_IMAGE
              value: {{ .Values.orchestrator.sandbox.image | quote }}
            - name: SANDBOX_CPU
              value: {{ .Values.orchestrator.sandbox.cpu | quote }}
            - name: SANDBOX_MEMORY
              value: {{ .Values.orchestrator.sandbox.memory | quote }}
            - name: SANDBOX_DISK
              value: {{ .Values.orchestrator.sandbox.disk | quote }}
            - name: SANDBOX_DEADLINE_S
              value: {{ .Values.orchestrator.sandbox.deadlineSeconds | quote }}
            - name: RUNS_DIR
              value: /opt/poseidon/runs
          volumeMounts:
            - name: runs
              mountPath: /opt/poseidon/runs
      volumes:
        - name: runs
          persistentVolumeClaim:
            claimName: orchestrator-runs
