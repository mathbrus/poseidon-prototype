# OPA. Two sources during the M2 overlap:
#   - the hand-authored policies/ directory via a ConfigMap (retires at
#     plan step 12, with poc.rego);
#   - compiled bundles, which OPA *polls* from the bundle server (§2b) —
#     never pushed, so an OPA restart re-fetches the current revision
#     instead of running on whatever it last held.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-config
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
data:
  config.yaml: |
    services:
      bundles:
        url: http://bundle-server:8081
    bundles:
      # Keyed and pathed by company *name* (which equals the namespace for
      # the bootstrap company) — the bundle server keys by company.
      {{ .Values.companyNamespace }}:
        service: bundles
        resource: bundles/{{ .Values.companyNamespace }}/bundle.tar.gz
        polling:
          min_delay_seconds: 5
          max_delay_seconds: 15
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-policies
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
data:
  {{- range $name, $content := .Values.opa.policies }}
  {{ $name }}.rego: |
    {{- $content | nindent 4 }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
        {{- include "poseidon.labels" . | nindent 8 }}
      annotations:
        # Roll the pods when the policy content changes.
        checksum/policies: {{ .Values.opa.policies | toJson | sha256sum }}
    spec:
      containers:
        - name: opa
          image: "{{ .Values.images.opa.repository }}:{{ .Values.images.opa.tag }}"
          imagePullPolicy: {{ .Values.images.opa.pullPolicy }}
          # Individual files, not the directory: a ConfigMap mount contains
          # kubelet symlink bookkeeping (..data/…) that a recursive directory
          # load would pick up as duplicate policies.
          args:
            - run
            - --server
            - --addr
            - 0.0.0.0:8181
            - --config-file
            - /config/config.yaml
            {{- range $name, $_ := .Values.opa.policies }}
            - /policies/{{ $name }}.rego
            {{- end }}
          ports:
            - containerPort: 8181
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            periodSeconds: 10
      volumes:
        - name: policies
          configMap:
            name: opa-policies
        - name: config
          configMap:
            name: opa-config
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
spec:
  selector:
    app: opa
  ports:
    - port: 8181
      targetPort: 8181
