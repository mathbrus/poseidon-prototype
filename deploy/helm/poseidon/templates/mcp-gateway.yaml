# MCP gateway: the only pod holding GIT_TOKEN. Audit events and sandbox
# registrations live in the registry since plan step 8 — the PVC that
# carried the audit JSONL is gone, and with it the reason this Deployment
# could not roll normally.
#
# Workload identity (plan step 11): the gateway verifies callers' projected
# service-account tokens through the TokenReview API, which needs its own
# ServiceAccount bound to system:auth-delegator.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-gateway
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: poseidon-mcp-gateway-auth-delegator
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: mcp-gateway
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-gateway
  template:
    metadata:
      labels:
        app: mcp-gateway
        {{- include "poseidon.labels" . | nindent 8 }}
    spec:
      serviceAccountName: mcp-gateway
      containers:
        - name: mcp-gateway
          image: "{{ .Values.images.gateway.repository }}:{{ .Values.images.gateway.tag }}"
          imagePullPolicy: {{ .Values.images.gateway.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: git-credentials
                  key: GIT_TOKEN
            - name: AGENT_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bearer-tokens
                  key: AGENT_BEARER_TOKEN
            - name: RUNNER_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bearer-tokens
                  key: RUNNER_BEARER_TOKEN
            - name: BASE_REF
              value: {{ .Values.run.baseRef | quote }}
            - name: OPA_URL
              value: http://opa:8181
            # Workload identity (plan step 11): where the orchestrator's
            # ServiceAccount lives, and the §2b key for verifying
            # platform-signed ephemeral JWTs (minted from step 16a).
            - name: PLATFORM_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: PLATFORM_JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-jwt-key
                  key: PLATFORM_JWT_KEY
            - name: REGISTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: registry-credentials
                  key: REGISTRY_DSN
          # No unauthenticated route exists; a 401 from the bearer middleware
          # proves the server is up without putting a token in the probe.
          # (httpGet probes treat 401 as failure, hence the exec probe.)
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request, urllib.error\ntry:\n    urllib.request.urlopen('http://localhost:8080/mcp')\nexcept urllib.error.HTTPError as e:\n    raise SystemExit(0 if e.code == 401 else 1)\nraise SystemExit(1)"
            periodSeconds: 5
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-gateway
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    app: mcp-gateway
  ports:
    - port: 8080
      targetPort: 8080
      {{- if .Values.gateway.service.nodePort }}
      nodePort: {{ .Values.gateway.service.nodePort }}
      {{- end }}
