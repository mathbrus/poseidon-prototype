# The sandbox egress proxy (plan step 5): enforces the host allowlist and
# audits every allow/deny with run attribution (§2b credential). The
# allowlist is static config in this phase — empty means zero egress; the
# compiler emits it from the blueprint at step 12. Deny events land in a
# PVC-backed JSONL until the registry audit table (step 8).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: egress-proxy-audit
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.egressProxy.audit.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.egressProxy.audit.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-proxy
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate: the audit PVC is ReadWriteOnce.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: egress-proxy
  template:
    metadata:
      labels:
        app: egress-proxy
        {{- include "poseidon.labels" . | nindent 8 }}
    spec:
      # The proxy holds no in-cluster identity, and service links would
      # shadow EGRESS_* env names with tcp:// pseudo-URLs.
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: proxy
          image: "{{ .Values.egressProxy.image.repository }}:{{ .Values.egressProxy.image.tag }}"
          imagePullPolicy: {{ .Values.egressProxy.image.pullPolicy }}
          env:
            - name: EGRESS_PROXY_KEY
              valueFrom:
                secretKeyRef:
                  name: egress-proxy-key
                  key: EGRESS_PROXY_KEY
            - name: EGRESS_ALLOW_HOSTS
              value: {{ join "," .Values.egressProxy.allowedHosts | quote }}
            - name: EGRESS_AUDIT_PATH
              value: /opt/poseidon/audit/egress.jsonl
          ports:
            - containerPort: 3128
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3128
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3128
            initialDelaySeconds: 10
          volumeMounts:
            - name: audit
              mountPath: /opt/poseidon/audit
      volumes:
        - name: audit
          persistentVolumeClaim:
            claimName: egress-proxy-audit
---
apiVersion: v1
kind: Service
metadata:
  name: egress-proxy
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
spec:
  selector:
    app: egress-proxy
  ports:
    - port: 3128
      targetPort: 3128
