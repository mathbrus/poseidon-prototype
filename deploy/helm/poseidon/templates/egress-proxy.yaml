# The sandbox egress proxy: enforces the host allowlist and
# audits every allow/deny with run attribution. The
# compiler emits the allowlist from the blueprint; empty means zero
# egress. Deny events go to the registry audit table, so one run_id query
# returns the gateway's decisions and the proxy's together.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-proxy
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: egress-proxy
  template:
    metadata:
      labels:
        app: egress-proxy
        {{- include "poseidon.labels" . | nindent 8 }}
    spec:
      # The proxy holds no in-cluster identity, and service links would
      # shadow EGRESS_* env names with tcp:// pseudo-URLs.
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: proxy
          image: "{{ .Values.egressProxy.image.repository }}:{{ .Values.egressProxy.image.tag }}"
          imagePullPolicy: {{ .Values.egressProxy.image.pullPolicy }}
          env:
            {{- include "poseidon.otelEnv" (dict "root" $ "service" "egress-proxy") | nindent 12 }}
            - name: EGRESS_PROXY_KEY
              valueFrom:
                secretKeyRef:
                  name: egress-proxy-key
                  key: EGRESS_PROXY_KEY
            # The allowlist is the applied blueprint's IR projection,
            # resolved per run through the registry, no
            # static host config.
            - name: REGISTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: registry-credentials
                  key: REGISTRY_DSN
          ports:
            - containerPort: 3128
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3128
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3128
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: egress-proxy
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
spec:
  selector:
    app: egress-proxy
  ports:
    - port: 3128
      targetPort: 3128
