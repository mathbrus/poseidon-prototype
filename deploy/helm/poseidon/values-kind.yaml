# kind overrides: a NodePort gateway behind the kind extraPortMapping
# (deploy/kind/kind-config.yaml maps host 127.0.0.1:8080 -> 30080) so a
# client on the host keeps the familiar URL. Everything else is identical
# to a real cluster.

mcpGateway:
  service:
    type: NodePort
    nodePort: 30080

console:
  service:
    type: NodePort
    nodePort: 30090
  # The people a kind cluster knows. A blueprint's `company.humans` must
  # be drawn from this list — the console refuses any other name — and
  # kind-up.sh logs you in as the first. `auditor` is named by no
  # blueprint on purpose: the acceptance suite's proof that a person the
  # console knows is still only what the company's policy lets them be.
  # `eval` is the evaluation harness (poseidon-eval), which acts on each
  # trial's company under its own name; like `auditor`, no blueprint in
  # this repository names it.
  humans:
    - owner
    - auditor
    - eval

# The egress allowlist comes from the applied blueprint
# (hello-saas admits the PyPI hosts, so the `pip install` allow path stays
# exercisable) — no static host config here.

networkPolicies:
  # kind-config.yaml pins podSubnet to Calico's default pool; the service
  # CIDR is kind's default.
  clusterCidrs:
    - 192.168.0.0/16
    - 10.96.0.0/12
