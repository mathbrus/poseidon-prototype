# Poseidon values. The release is installed into the platform namespace
# (`helm install -n poseidon-platform --create-namespace`); company
# namespaces are the operator's, created from Company CRs.
# Defaults here are cluster-agnostic; kind overrides live in values-kind.yaml.

# The company this installation hosts. Its namespace is its name (the
# operator creates it from the Company CR); here it wires the platform
# side: the worker's COMPANY, the platform NetworkPolicies that select the
# company namespace, and the OPA bundle config key.
company: hello-saas

# Every poseidon-* image is built from the root Dockerfile by
# deploy/build-images.sh. Tags default to `latest` only so the chart installs
# standalone; deploy/kind/kind-up.sh overrides every one of them with a
# content-addressed tag, which is what forces a rollout when code changes (a fixed tag renders
# an identical pod template, so pods keep running the code they started
# with even after `kind load` replaces the image).
images:
  mcpGateway:
    repository: poseidon-mcp-gateway
    tag: latest
    # Images are side-loaded on kind (`kind load docker-image`); IfNotPresent
    # keeps the kubelet from trying to pull them from a registry.
    pullPolicy: IfNotPresent
  agent:
    repository: poseidon-agent
    tag: latest
    pullPolicy: IfNotPresent
  opa:
    # The plain (distroless) image is enough on Kubernetes: probes are
    # kubelet-side httpGet, not in-container commands. Pinned: policy
    # enforcement must not change under a silent image drift.
    repository: openpolicyagent/opa
    tag: "1.19.0"
    pullPolicy: IfNotPresent
  llmProxy:
    # Pinned to a LiteLLM release that knows gpt-5.6-luna (chat completions
    # + function calling). Tag form is vX.Y.Z.
    repository: ghcr.io/berriai/litellm
    tag: v1.95.1
    pullPolicy: IfNotPresent
  orchestrator:
    repository: poseidon-orchestrator
    tag: latest
    pullPolicy: IfNotPresent
  operator:
    repository: poseidon-operator
    tag: latest
    pullPolicy: IfNotPresent
  llmGateway:
    repository: poseidon-llm-gateway
    tag: latest
    pullPolicy: IfNotPresent

# Secrets layout: GIT_TOKEN mountable only into the gateway,
# LLM_API_KEY only into LiteLLM — both live in the platform namespace.
# Caller identity is workload tokens (no static bearer tokens anywhere).
#
# No defaults on purpose: every value below is `required` in the
# templates, so a bare `helm install` fails loudly instead of deploying
# with a placeholder signing key. Real values come from the bootstrap
# script (deploy/kind/kind-up.sh writes them from .env into a private
# values file) or any values override.
secrets:
  gitToken: ""
  llmApiKey: ""
  # Cluster-internal only (Postgres never leaves the platform namespace).
  postgresPassword: ""
  # Shared HMAC key for per-run egress credentials: egress-proxy and
  # the orchestrator worker only; sandboxes see only their derived credential.
  egressProxyKey: ""

# Run configuration (the env subset the in-cluster services need).
run:
  model: gpt-5.6-luna
  targetRepo: github.com/example-org/example-repo
  baseRef: main
  # Implement's advisory verify cycles before the implementer reports the
  # tests still failing; every other procedure has its own step cap.
  verifyCycles: 10

orchestrator:
  temporalAddress: temporal-frontend:7233
  # SandboxPolicy values come from the applied blueprint's infra IR;
  # the deployment supplies only the resolution of the IR's
  # logical toolchain image (content-addressed on kind).
  sandbox:
    image: poseidon-sandbox

# The LLM gateway: tier -> model resolution and the flat
# price per 1K tokens the ledger accrues at. The blueprint names
# tiers; only the deployment knows the concrete models. In mock mode every
# tier resolves to the mock brain via values-mockllm.yaml.
llmGateway:
  # LiteLLM is started in single-model mode (--model run.model), so every
  # tier must name that same model or the proxy 400s the request. Split
  # tiers need a LiteLLM model_list, which this chart does not mount.
  tierModels:
    frontier: gpt-5.6-luna
    standard: gpt-5.6-luna
    small: gpt-5.6-luna

# Sandbox egress proxy. The allowlist is the applied
# blueprint's compiled IR projection, resolved per run via
# the registry — a run without an applied blueprint has zero egress.
# Deny/allow audit events carry the per-run credential attribution.
egressProxy:
  image:
    repository: poseidon-egress-proxy
    tag: latest
    pullPolicy: IfNotPresent

postgres:
  image:
    repository: postgres
    tag: "16.6"
    pullPolicy: IfNotPresent
  # Superuser for the whole instance: Temporal's schema tool creates its own
  # databases with it, and the registry keeps its `registry` schema
  # in the default database of the same name.
  user: poseidon
  storage: 5Gi
  # null = the cluster's default StorageClass.
  storageClassName: null

mcpGateway:
  service:
    type: ClusterIP
    # Set (with type NodePort) to give the host-side runner a stable port.
    nodePort: null

networkPolicies:
  enabled: true
  # CIDRs treated as cluster-internal: the gateway's external egress rule
  # (git host) excludes them so "external" never quietly includes pods or
  # services. Must match the cluster's pod and service CIDRs.
  clusterCidrs:
    - 10.244.0.0/16
    - 10.96.0.0/12
  # Where the host-side runner's dispatch/status calls enter the agent pod
  # from (NodePort traffic is SNAT'd to a node address). 172.16.0.0/12 covers
  # any Docker bridge subnet (Docker picks one per host), plus the pod CIDR
  # for node addresses on the overlay.
  runnerIngressCidrs:
    - 172.16.0.0/12
    - 10.244.0.0/16
