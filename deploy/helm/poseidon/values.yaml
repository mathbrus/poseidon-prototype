# Poseidon values. The release is installed into the platform namespace
# (`helm install -n poseidon-platform --create-namespace`); company
# namespaces are the operator's, created from Company CRs (plan step 10).
# Defaults here are cluster-agnostic; kind overrides live in values-kind.yaml.

# The bootstrap company's namespace — platform-side wiring only: the worker's
# AGENT_URL/SANDBOX_NAMESPACE, the platform NetworkPolicies that select the
# company namespace, and the OPA bundle config key. Goes per-company at
# steps 12/16; the namespace itself is operator-created either way.
companyNamespace: hello-saas

# Image tags default to `latest` only so the chart installs standalone;
# deploy/kind/kind-up.sh overrides every one of them with a content-addressed
# tag, which is what forces a rollout when code changes (a fixed tag renders
# an identical pod template, so pods keep running the code they started
# with even after `kind load` replaces the image).
images:
  gateway:
    repository: poseidon-gateway
    tag: latest
    # Images are side-loaded on kind (`kind load docker-image`); IfNotPresent
    # keeps the kubelet from trying to pull them from a registry.
    pullPolicy: IfNotPresent
  agent:
    repository: poseidon-agent
    tag: latest
    pullPolicy: IfNotPresent
  opa:
    # The plain (distroless) image is enough on Kubernetes: probes are
    # kubelet-side httpGet, not in-container commands as on Compose.
    repository: openpolicyagent/opa
    tag: latest
    pullPolicy: IfNotPresent
  llmProxy:
    repository: ghcr.io/berriai/litellm
    tag: main-stable
    pullPolicy: IfNotPresent
  orchestrator:
    repository: poseidon-orchestrator
    tag: latest
    pullPolicy: IfNotPresent
  operator:
    repository: poseidon-operator
    tag: latest
    pullPolicy: IfNotPresent

# Secrets layout (plan step 1a): GIT_TOKEN mountable only into the gateway,
# LLM_API_KEY only into LiteLLM — both live in the platform namespace. The
# static bearer tokens are the PoC identity placeholders (deleted at step 12):
# the gateway holds both, the agent (company namespace) only its own.
# Placeholders keep `helm install` self-contained; real values come from the
# bootstrap script (kind) or a values override (real cluster).
secrets:
  gitToken: ghp_replace-with-repo-scoped-pat
  llmApiKey: sk-replace-with-provider-key
  agentBearerToken: agent-token-placeholder
  runnerBearerToken: runner-token-placeholder
  # Cluster-internal only (Postgres never leaves the platform namespace).
  postgresPassword: postgres-password-placeholder
  # Shared HMAC key for per-run egress credentials (§2b): egress-proxy and
  # the orchestrator worker only; sandboxes see only their derived credential.
  egressProxyKey: egress-proxy-key-placeholder
  # The §2b platform signing key (plan step 11): gateway verifies
  # platform-signed ephemeral JWTs; the orchestrator mints from step 16a.
  platformJwtKey: platform-jwt-key-placeholder

# Run configuration (the C7 subset the in-cluster services need).
run:
  model: gpt-4o-mini
  targetRepo: github.com/example-org/example-repo
  baseRef: main
  maxIterations: 10

orchestrator:
  temporalAddress: temporal-frontend:7233
  # Hand-authored SandboxPolicy values for the k8s_jobs backend (plan step 4,
  # sequencing choice 2): one Job per run in the company namespace, capped
  # and deadlined. Replaced by the compiler-emitted infra IR at step 12.
  sandbox:
    image: poseidon-sandbox
    cpu: "1"
    memory: 1Gi
    disk: 2Gi
    deadlineSeconds: 3600

# Sandbox egress proxy (plan step 5). The allowlist is static per-phase
# config — empty means zero egress, exactly the PoC posture; the compiler
# emits it from the blueprint at step 12. Deny/allow audit events carry the
# per-run credential attribution.
egressProxy:
  image:
    repository: poseidon-egress-proxy
    tag: latest
    pullPolicy: IfNotPresent
  allowedHosts: []

postgres:
  image:
    repository: postgres
    tag: "16.6"
    pullPolicy: IfNotPresent
  # Superuser for the whole instance: Temporal's schema tool creates its own
  # databases with it, and the registry (step 8) keeps its `registry` schema
  # in the default database of the same name.
  user: poseidon
  storage: 5Gi
  # null = the cluster's default StorageClass.
  storageClassName: null

opa:
  # Rego files served to OPA, keyed by basename (".rego" is appended).
  # Populated at install time from the canonical policies/ directory:
  #   --set-file opa.policies.poc=policies/poc.rego
  # so the repo keeps a single source of truth for policy.
  policies: {}

gateway:
  service:
    type: ClusterIP
    # Set (with type NodePort) to give the host-side runner a stable port.
    nodePort: null

networkPolicies:
  enabled: true
  # CIDRs treated as cluster-internal: the gateway's external egress rule
  # (git host) excludes them so "external" never quietly includes pods or
  # services. Must match the cluster's pod and service CIDRs.
  clusterCidrs:
    - 10.244.0.0/16
    - 10.96.0.0/12
  # Where the host-side runner's dispatch/status calls enter the agent pod
  # from (NodePort traffic is SNAT'd to a node address). 172.16.0.0/12 covers
  # any Docker bridge subnet (Docker picks one per host), plus the pod CIDR
  # for node addresses on the overlay.
  runnerIngressCidrs:
    - 172.16.0.0/12
    - 10.244.0.0/16
