# Mock LLM overlay: the llm-proxy Deployment runs the deterministic
# poseidon-mockllm brain instead of LiteLLM, so e2e runs spend no provider
# tokens. Everything else — service name, label, port, probes,
# NetworkPolicies, agent env — is untouched; the agent cannot tell the
# difference. kind-up.sh applies this by default; REAL_LLM=1 skips it.
images:
  llmProxy:
    repository: poseidon-mockllm
    tag: latest
    pullPolicy: IfNotPresent

run:
  model: mock-brain

orchestrator:
  timeoutProfile: fast

# Every tier resolves to the mock brain — the ledger then records what was
# actually served instead of a paid model name nothing answered as.
llmGateway:
  tierModels:
    frontier: mock-brain
    standard: mock-brain
    small: mock-brain
