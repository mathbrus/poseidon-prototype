# Poseidon PoC runtime (prototype.md §3): the network topology IS the E3
# enforcement mechanism. Internal networks have no route out; `egress` is the
# only bridge to the internet and carries exactly the two credential holders.
#
#   agentnet   (internal)  agent <-> mcp-gateway, llm-proxy — all the agent can see
#   sandboxnet (internal)  mcp-gateway <-> per-run sandboxes (started by the runner)
#   opanet     (internal)  mcp-gateway <-> opa
#   egress     (bridge)    mcp-gateway, llm-proxy — the only two with internet
#
# The runner runs on the host: it reaches the gateway through the published
# port (possible because the gateway is also on `egress`) and the agent via a
# static IP on agentnet (internal networks cannot publish ports, but the host
# routes to them over the bridge). Sandboxes are attached to `sandboxnet` at
# run time — its fixed name is what SANDBOX_NETWORK in .env must carry.

name: poseidon

networks:
  agentnet:
    name: poseidon-agentnet
    internal: true
    ipam:
      config:
        # Fixed subnet so the agent's address (AGENT_URL) is deterministic.
        - subnet: 172.28.10.0/24
  sandboxnet:
    name: poseidon-sandboxnet
    internal: true
  opanet:
    name: poseidon-opanet
    internal: true
  egress:
    name: poseidon-egress

services:
  opa:
    # The -debug tag ships a busybox shell + wget; the default image is
    # distroless and cannot run a healthcheck.
    image: openpolicyagent/opa:latest-debug
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "/policies"]
    volumes:
      - ../../policies:/policies:ro
    networks:
      - opanet
    healthcheck:
      # GET, not --spider: OPA answers 405 to the HEAD request spider sends.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8181/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  llm-proxy:
    # Stock LiteLLM in single-model mode: holds the provider key so the agent
    # container never sees it (invariant #1 / E3).
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--model", "${MODEL}", "--port", "4000"]
    environment:
      # LLM_API_KEY is provider-agnostic in the contract (C7); LiteLLM reads
      # provider-specific names, so hand the key to every provider MODEL may
      # imply — LiteLLM only ever reads the one matching the model's prefix.
      OPENAI_API_KEY: ${LLM_API_KEY}
      ANTHROPIC_API_KEY: ${LLM_API_KEY}
    networks:
      - agentnet
      - egress
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  mcp-gateway:
    build:
      context: ../..
      dockerfile: Dockerfile.gateway
    image: poseidon-gateway
    environment:
      GIT_TOKEN: ${GIT_TOKEN}
      AGENT_BEARER_TOKEN: ${AGENT_BEARER_TOKEN}
      RUNNER_BEARER_TOKEN: ${RUNNER_BEARER_TOKEN}
      BASE_REF: ${BASE_REF:-main}
      OPA_URL: http://opa:8181
      AUDIT_PATH: /opt/poseidon/runs/audit.jsonl
    volumes:
      # The audit JSONL and run manifests live on the host so the runner and
      # the E2E tests can read them.
      - ../../runs:/opt/poseidon/runs
    ports:
      # Host-side runner entrypoint (MCP + /admin/sandboxes).
      - "127.0.0.1:8080:8080"
    networks:
      - agentnet
      - sandboxnet
      - opanet
      - egress
    depends_on:
      opa:
        condition: service_healthy
    healthcheck:
      # No unauthenticated route exists; a 401 from the bearer middleware
      # proves the server is up without putting a token in the healthcheck.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, urllib.error\ntry:\n    urllib.request.urlopen('http://localhost:8080/mcp')\nexcept urllib.error.HTTPError as e:\n    raise SystemExit(0 if e.code == 401 else 1)\nraise SystemExit(1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  agent:
    build:
      context: ../..
      dockerfile: Dockerfile.agent
    image: poseidon-agent
    environment:
      # In-network URLs are topology, not deployment config — hardcoded here.
      MCP_GATEWAY_URL: http://mcp-gateway:8080
      LLM_PROXY_URL: http://llm-proxy:4000
      MODEL: ${MODEL}
      TARGET_REPO: ${TARGET_REPO}
      MAX_ITERATIONS: ${MAX_ITERATIONS:-10}
      AGENT_BEARER_TOKEN: ${AGENT_BEARER_TOKEN}
      # python:3.12-slim bakes GPG_KEY into the image; unset it so the only
      # token/key-shaped variable in the agent env is AGENT_BEARER_TOKEN (E3).
      GPG_KEY: null
    networks:
      agentnet:
        # Fixed address so the host-side runner can reach C6 (AGENT_URL);
        # agentnet is internal, so a published port is not an option.
        ipv4_address: 172.28.10.10
    depends_on:
      mcp-gateway:
        condition: service_healthy
      llm-proxy:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
