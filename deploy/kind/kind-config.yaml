# Poseidon kind cluster (plan step 1a).
#
# - Default CNI disabled: kindnet does not enforce NetworkPolicy, and step 1c
#   depends on enforcement; the bootstrap installs Calico instead. The pod
#   subnet matches Calico's default IPv4 pool.
# - extraPortMappings expose the gateway and agent NodePorts (values-kind.yaml)
#   on the host's loopback under the familiar Compose ports, so the host-side
#   runner keeps MCP_GATEWAY_URL=http://127.0.0.1:8080 and
#   AGENT_URL=http://127.0.0.1:8000.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: poseidon
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # mcp-gateway NodePort
        hostPort: 8080
        listenAddress: 127.0.0.1
      - containerPort: 30800   # agent NodePort
        hostPort: 8000
        listenAddress: 127.0.0.1
