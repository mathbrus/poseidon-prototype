# hello-saas-delegated — the company that finishes its own work: in-class
# passing work (`slugify.py`, the unit-test tree) merges under compiled
# policy with no human command. A person answers everything the
# delegation does not cover — carve-outs, out-of-class paths, a declined
# policy merge, and the acceptance-contract tree the delegation is graded
# by, which only the contract author may write. Removing the `delegate`
# block reverts to human-only merge.

apiVersion: poseidon.dev/v1

company:
  name: hello-saas
  vision: >-
    A small SaaS that turns titles into URL slugs, delivered and kept
    green by a company of agents that never exceeds its authority.
  # The people who may act on this company through the console: answer
  # its gates, start or cancel a run by hand, wake the heartbeat, apply
  # this document again. On kind, `owner` is the human the chart declares.
  humans:
    - owner
  # The two documents the company writes for itself, in its repository:
  # the strategy (written once from the vision) and the architecture
  # masterplan (written from the vision and the tree, revised on request).
  documents:
    strategy: docs/STRATEGY.md
    architecture: docs/ARCHITECTURE.md

stack:
  # The one repository this company works on, and the branch its changes
  # are measured and delivered against.
  repo:
    url: github.com/example-org/hello-saas
    base_ref: main
  toolchain:
    image: poseidon-sandbox
    test_command: pytest -q
    egress_allow:
      - pypi.org
      - files.pythonhosted.org

standing:
  pm:
    role: pm
    count: 1
    may_spawn:
      crew: [contract-authoring, feature-delivery, feature-review, stewardship]
      max_concurrent: 2

# The one place a role's scope is narrowed, for standing and ephemeral
# agents of the role alike; a role not listed keeps its catalog tools.
# The reviewer drops the write tools its catalog role would allow: it
# judges, it does not fix.
tools:
  reviewer:
    allow:
      - sandbox.read_file
      - sandbox.list_dir
      - sandbox.exec
      - sandbox.run_tests
      - git.read
      - git.comment
      - issues.comment
      - architecture.request

workflows:
  implement:
    crew: feature-delivery
    max_verify_retries: 2
  # --8<-- [start:review-delegated]
  review:
    crew: feature-review
    gates:
      merge:
        resolved_by: policy
        # The wait when policy declines and the merge parks on a human.
        deadline_minutes: 1440
        delegate:
          # The unit-test tree, never the whole of tests/: the contract
          # tree below is the oracle these merges are graded by. The
          # company's documents merge under policy too: the reviewer's
          # verdict is the only oracle a document has.
          paths: [slugify.py, tests/unit/, docs/]
          max_reworks: 1
          # --8<-- [end:review-delegated]

policies:
  branch_protection:
    protected: [main]
    allowed_pattern: ^feature/[a-z0-9-]+$
  deny_paths:
    - .github/workflows/
  # The split oracle: the acceptance spec delegated merges are graded by
  # comes from different hands than the code it certifies, so the
  # implementer cannot rewrite the test that grades its own work.
  # --8<-- [start:contract_tests]
  contract_tests:
    paths: [tests/contract/]
    roles: [contract-author]
    # --8<-- [end:contract_tests]

budgets:
  per_run:
    usd: 5
    # How long a run stopped at the cap waits for someone to raise it.
    pause_minutes: 60

# The company's own initiative: who decides, what it may start on its own,
# how many at once, how many tries an item gets, how large the backlog may
# grow before it stops scoping, and the day's hard stop.
# --8<-- [start:heartbeat]
heartbeat:
  conductor: pm
  reconcile_minutes: 30
  max_concurrent_runs: 1
  max_attempts: 2
  max_open_tickets: 5
  may_start: [scope, implement, review]
  daily_cap:
    usd: 20
    # --8<-- [end:heartbeat]
