# hello-saas-delegated — the flagship autonomous company: a standing
# heartbeat AND a POLICY-RESOLVED merge gate. Like hello-saas-conducted,
# the PM runs the backlog on a heartbeat; unlike it, in-class passing work
# merges under compiled policy with no human command at all. The merge gate
# is delegated for a narrow class of changes: a passing independent review
# plus the platform's own green checks merges a PR touching only
# `slugify.py` or the unit-test tree. Everything else still stops — a carve-out
# surface, an out-of-class path, or a decline falls back to the human
# `merge` signal; a failed quality layer feeds the bounded rework loop.
# Removing the `delegate` block reverts to human-only merge: revocation is
# a diff.

apiVersion: poseidon.dev/v1

company:
  name: hello-saas
  mission: Ship a small SaaS product with an agent company under governance.
  product: A URL-shortening service with a REST API.
  stage: prototype

stack:
  languages: [python]
  frameworks: [fastapi]
  repos:
    - name: app
      url: github.com/example-org/hello-saas
      default_branch: main
  toolchain:
    image: poseidon-sandbox
    test_command: pytest -q
    # Reaches the audited egress proxy only; an empty list
    # would mean zero egress.
    egress_allow:
      - pypi.org
      - files.pythonhosted.org

departments:
  roles:
    pm:
      template: pm
      count: 1
      model_tier: standard
      may_spawn:
        crew: [contract-authoring, feature-delivery, feature-review]
        max_concurrent: 2

crews:
  # The oracle's authors: one deliver-capable agent, no planner — the
  # contract ticket the PM files IS the brief. A crew of its own is what
  # makes the split positional: `contract-author` is not a template the
  # delivery crew contains, so the implementer cannot be the hand that
  # writes the spec it is graded by.
  contract-authoring:
    agents:
      author:
        role_template: contract-author
        tools:
          - sandbox.read_file
          - sandbox.write_file
          - sandbox.list_dir
          - sandbox.exec
          - sandbox.run_tests
          - sandbox.git_bundle
          - git.open_pr
    budget_inheritance: run
  feature-delivery:
    agents:
      # LLM-only: reads the run's sandbox, writes nothing, produces the task
      # brief the executor's dispatch carries verbatim.
      planner:
        role_template: backend-engineer
        needs_sandbox: false
        tools:
          - sandbox.read_file
          - sandbox.list_dir
          - issues.read
      executor:
        role_template: backend-engineer
        tools:
          - sandbox.read_file
          - sandbox.write_file
          - sandbox.list_dir
          - sandbox.exec
          - sandbox.run_tests
          - sandbox.git_bundle
          - git.open_pr
    budget_inheritance: run
  feature-review:
    agents:
      reviewer:
        role_template: sdet
        tools:
          - sandbox.read_file
          - sandbox.list_dir
          - sandbox.exec
          - sandbox.run_tests
          - git.read
          - git.comment
          - issues.comment
    budget_inheritance: run

# Per-role gateway scopes. The PM's list is deliberately narrow: spawn
# authority is not permission to wield the crew's tools, so
# no sandbox writes and no git.open_pr appear here.
tools:
  pm:
    allow:
      - issues.create
      - issues.read
      - issues.update
      - issues.comment
      - crew.request
  sdet:
    allow:
      - sandbox.read_file
      - sandbox.list_dir
      - sandbox.exec
      - sandbox.run_tests
      - git.read
      - git.comment
      - issues.comment

workflows:
  intake:
    enabled: true
    # No intake gate declared: goals a human submits dispatch the PM
    # without a second stop.
    conductor: pm
  implement:
    enabled: true
    conductor: pm
    crew: feature-delivery
    max_verify_retries: 2
    drain:
      on_conductor_drain: abort_crew
      timeout_minutes: 30
  review:
    enabled: true
    conductor: pm
    crew: feature-review
    gates:
      # The delegated merge gate: compiled policy merges a passing,
      # independently-reviewed, in-class change with no human command; a
      # decline or a carve-out falls back to the human `merge` signal.
      merge:
        resolved_by: policy
        delegate:
          # The unit-test tree only — never the whole of tests/: the
          # contract/acceptance tree is the oracle delegated merges are
          # graded by, and the oracle never rides the delegation it
          # certifies.
          paths: [slugify.py, tests/unit/]
          max_reworks: 1
    drain:
      on_conductor_drain: abort_crew
      timeout_minutes: 30

policies:
  branch_protection:
    protected: [main]
    allowed_pattern: ^feature/[a-z0-9-]+$
  deny_paths:
    - .github/workflows/
  # The split oracle. This tree is the acceptance spec delegated merges are
  # graded by, so it comes from different hands and merges under different
  # authority than the code it certifies:
  #   - only `contract-author` may `git.open_pr` into it — the implementer's
  #     attempt dies at the gateway, named, and the PR never exists;
  #   - it can never be delegated (a `delegate.paths` overlap is a
  #     validate-time error), so an oracle edit always parks on the human
  #     `merge` signal with the platform's deletion facts on the PR;
  #   - and the gating fact is this tree as it stands on `main`, run against
  #     the PR head — a head suite weakened to green launders nothing.
  # Deleting this block reverts to one implementer-owned tree: the split is
  # authority, so revoking it is a diff.
  contract_tests:
    paths: [tests/contract/]
    roles: [contract-author]
  escalation:
    channel: api
    timeout_minutes: 60

budgets:
  per_run:
    usd: 5

# The standing heartbeat: the flagship delegated company runs its own
# backlog. In-class passing work merges under compiled policy with no human
# command; carve-out PRs still park on the human `merge` signal.
conduct:
  conductor: pm
  heartbeat_minutes: 30
  max_concurrent_runs: 1
  may_start: [implement, review]
  daily_cap:
    usd: 20
