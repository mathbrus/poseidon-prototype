# hello-saas-delegated — the company that runs itself: a heartbeat starts
# its runs from the backlog, and in-class passing work (`slugify.py`, the
# unit-test tree) merges under compiled policy with no human command. A
# person still feeds goals in and answers everything the delegation does
# not cover — carve-outs, out-of-class paths, a declined policy merge, and
# the acceptance-contract tree the delegation is graded by, which only the
# contract author may write. Removing the `delegate` block reverts to
# human-only merge; removing `heartbeat` reverts to human-started runs.

apiVersion: poseidon.dev/v1

company:
  name: hello-saas
  mission: Ship a small SaaS product with an agent company under governance.

stack:
  # The one repository this company works on, and the branch its changes
  # are measured and delivered against.
  repo:
    url: github.com/example-org/hello-saas
    base_ref: main
  toolchain:
    image: poseidon-sandbox
    test_command: pytest -q
    egress_allow:
      - pypi.org
      - files.pythonhosted.org

standing:
  pm:
    role: pm
    count: 1
    model_tier: standard
    may_spawn:
      crew: [contract-authoring, feature-delivery, feature-review]
      max_concurrent: 2

# The one place a role's scope is narrowed, for standing and ephemeral
# agents of the role alike; a role not listed keeps its catalog tools.
# The reviewer drops the write tools its catalog role would allow: it
# judges, it does not fix.
tools:
  reviewer:
    allow:
      - sandbox.read_file
      - sandbox.list_dir
      - sandbox.exec
      - sandbox.run_tests
      - git.read
      - git.comment
      - issues.comment

workflows:
  intake:
    enabled: true
    conductor: pm
  implement:
    enabled: true
    conductor: pm
    crew: feature-delivery
    max_verify_retries: 2
  review:
    enabled: true
    conductor: pm
    crew: feature-review
    gates:
      merge:
        resolved_by: policy
        # The wait when policy declines and the merge parks on a human.
        deadline_minutes: 1440
        delegate:
          # The unit-test tree, never the whole of tests/: the contract
          # tree below is the oracle these merges are graded by.
          paths: [slugify.py, tests/unit/]
          max_reworks: 1

policies:
  branch_protection:
    protected: [main]
    allowed_pattern: ^feature/[a-z0-9-]+$
  deny_paths:
    - .github/workflows/
  # The split oracle: the acceptance spec delegated merges are graded by
  # comes from different hands than the code it certifies, so the
  # implementer cannot rewrite the test that grades its own work.
  contract_tests:
    paths: [tests/contract/]
    roles: [contract-author]

budgets:
  per_run:
    usd: 5
    # How long a run stopped at the cap waits for someone to raise it.
    pause_minutes: 60

# The company's own initiative: what it may start on its own, how many at
# once, how many tries an item gets, and the day's hard stop.
heartbeat:
  conductor: pm
  reconcile_minutes: 30
  max_concurrent_runs: 1
  max_attempts: 2
  may_start: [implement, review]
  daily_cap:
    usd: 20
