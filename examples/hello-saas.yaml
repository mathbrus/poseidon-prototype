# hello-saas — a small company a human runs: one standing PM that scopes
# goals into tickets, ephemeral crews that implement and review under its
# authority, and a person who starts each run and answers the merge gate.
apiVersion: poseidon.dev/v1

company:
  name: hello-saas
  mission: Ship a small SaaS product with an agent company under governance.

stack:
  repos:
    - name: app
      url: github.com/example-org/hello-saas
      default_branch: main
  toolchain:
    image: poseidon-sandbox
    test_command: pytest -q
    egress_allow:
      - pypi.org
      - files.pythonhosted.org

standing:
  pm:
    role: pm
    count: 1
    model_tier: standard
    may_spawn:
      crew: [feature-delivery, feature-review]
      max_concurrent: 2

# The one place a role's scope is narrowed, for standing and ephemeral
# agents of the role alike; a role not listed keeps its catalog tools.
# The reviewer drops the write tools its catalog role would allow: it
# judges, it does not fix.
tools:
  reviewer:
    allow:
      - sandbox.read_file
      - sandbox.list_dir
      - sandbox.exec
      - sandbox.run_tests
      - git.read
      - git.comment
      - issues.comment

workflows:
  intake:
    enabled: true
    conductor: pm
  implement:
    enabled: true
    conductor: pm
    crew: feature-delivery
    max_verify_retries: 2
  review:
    enabled: true
    conductor: pm
    crew: feature-review
    gates:
      merge:
        resolved_by: human
        # A working day for the person who answers; escalation at half.
        deadline_minutes: 1440

policies:
  branch_protection:
    protected: [main]
    allowed_pattern: ^feature/[a-z0-9-]+$
  deny_paths:
    - .github/workflows/

budgets:
  per_run:
    usd: 5
    # How long a run stopped at the cap waits for someone to raise it.
    pause_minutes: 60
