# hello-saas-heartbeat — hello-saas.yaml plus a `heartbeat` section: the
# company starts its own work from the backlog under declared caps, no
# human starting the next run. Used by the overnight acceptance capstone
# and the unattended-path red-team.

apiVersion: poseidon.dev/v1

company:
  name: hello-saas
  mission: Ship a small SaaS product with an agent company under governance.
  product: A URL-shortening service with a REST API.
  stage: prototype

stack:
  languages: [python]
  frameworks: [fastapi]
  repos:
    - name: app
      url: github.com/example-org/hello-saas
      default_branch: main
  toolchain:
    image: poseidon-sandbox
    test_command: pytest -q
    # Reaches the audited egress proxy only; an empty list
    # would mean zero egress.
    egress_allow:
      - pypi.org
      - files.pythonhosted.org

standing:
  pm:
    role: pm
    count: 1
    model_tier: standard
    may_spawn:
      crew: [feature-delivery, feature-review]
      max_concurrent: 2

crews:
  feature-delivery:
    roles: [implementer]
  feature-review:
    roles: [reviewer]

# Per-role gateway scopes, for standing and ephemeral agents of the role
# alike; a role not listed here gets its catalog tools. The PM's list is
# deliberately narrow: spawn authority is not permission to wield the
# crew's tools, so no sandbox writes and no git.open_pr appear here.
# issues.comment is how the PM leaves its intake summary on the tickets
# it files. The reviewer's list drops the write tools its catalog role
# would allow: it judges, it does not fix.
tools:
  pm:
    allow:
      - issues.create
      - issues.read
      - issues.comment
      - crew.request
  reviewer:
    allow:
      - sandbox.read_file
      - sandbox.list_dir
      - sandbox.exec
      - sandbox.run_tests
      - git.read
      - git.comment
      - issues.comment

workflows:
  intake:
    enabled: true
    # No intake gate declared: goals a human submits dispatch the PM
    # without a second stop.
    conductor: pm
  implement:
    enabled: true
    conductor: pm
    crew: feature-delivery
    max_verify_retries: 2
  review:
    enabled: true
    conductor: pm
    crew: feature-review
    gates:
      # The one human gate: the orchestrator merges under
      # its platform identity only after this signal arrives.
      merge:
        resolved_by: human
        # A working day for the person who answers; escalation at half.
        deadline_minutes: 1440

policies:
  branch_protection:
    protected: [main]
    allowed_pattern: ^feature/[a-z0-9-]+$
  deny_paths:
    - .github/workflows/

budgets:
  per_run:
    usd: 5
    # How long a run stopped at the cap waits for someone to raise it.
    pause_minutes: 60

heartbeat:
  conductor: pm
  reconcile_minutes: 30
  max_concurrent_runs: 1
  # A run that aborts before concluding (a timed-out model call, a step
  # cap) leaves its issue or PR on the backlog for one more try; a run
  # that delivered or reached a verdict consumes it at once.
  max_attempts: 2
  may_start: [implement, review]
  daily_cap:
    usd: 20
