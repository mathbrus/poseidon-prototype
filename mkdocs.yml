# The docs site. GitHub keeps the files that live next to the code (the
# root README, CLAUDE.md, one README per package); this site is the second
# way to use the documentation: search a concept, follow a guide, look up a
# contract. Reference pages are generated from the code at build time by
# scripts/gen_docs.py, so nothing on them is typed twice.
site_name: Poseidon
site_description: >-
  An autonomous software company, run by cloud coding agents, that cannot
  exceed its authority.
repo_url: https://github.com/mathbrus/poseidon-prototype
repo_name: mathbrus/poseidon-prototype
edit_uri: edit/master/docs/

# A broken link, an orphaned page or a missing snippet fails the build.
strict: true

docs_dir: docs
exclude_docs: |
  .*
  _source/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Pages include the shipped blueprint and the glossary from their one
  # home in the repository rather than carrying a copy.
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

plugins:
  - search

nav:
  - Home: index.md
