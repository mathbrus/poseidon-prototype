# The docs site. GitHub keeps the files that live next to the code (the
# root README, CLAUDE.md, one README per package); this site is the second
# way to use the documentation: search a concept, follow a guide, look up a
# contract. Reference pages are generated from the code at build time by
# scripts/gen_docs.py, so nothing on them is typed twice.
site_name: Poseidon
site_description: >-
  An autonomous software company, run by cloud coding agents, that cannot
  exceed its authority.
repo_url: https://github.com/mathbrus/poseidon-prototype
repo_name: mathbrus/poseidon-prototype
edit_uri: edit/master/docs/

# A broken link, a missing anchor, an orphaned page or a missing snippet
# fails the build.
strict: true
validation:
  anchors: warn

docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Pages include the shipped blueprint and the glossary from their one
  # home in the repository rather than carrying a copy.
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
      dedent_subsections: true

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_docs.py

nav:
  - Home: index.md
  - Get started:
      - Quickstart: get-started/quickstart.md
  - How-to guides:
      - Delegate merges: how-to/delegate-merges.md
      - Use a real model: how-to/real-model.md
  - Explanation:
      - How it works: explanation/how-it-works.md
      - Anatomy of a run: explanation/anatomy.md
      - Security model: explanation/security-model.md
      - Limitations: explanation/limitations.md
      - What it can do: explanation/capabilities.md
      - Further reading: explanation/reading.md
      - Architecture: explanation/architecture.md
      - Concepts:
          - concepts/index.md
          - MCP: concepts/mcp.md
          - OPA and Rego: concepts/opa.md
          - Workload identity: concepts/workload-identity.md
          - NetworkPolicy: concepts/network-policy.md
          - Temporal: concepts/temporal.md
          - Standing vs. ephemeral agents: concepts/standing-vs-ephemeral.md
  - Reference:
      - Blueprint: reference/blueprint.md
      - CLI: reference/cli.md
      - Console API: reference/console.md
      - Tools: reference/tools.md
      - Roles and crews: reference/roles.md
      - Workflows and signals: reference/workflows.md
      - Policy and audit: reference/policy.md
      - Glossary: reference/glossary.md
  - Contributing:
      - Contributing: developing/contributing.md
      - Packages: developing/packages.md
      - Run the acceptance suite: developing/acceptance.md
      - Releasing: developing/releasing.md
      - Writing docs: developing/writing-docs.md
  - Changelog: changelog.md
