[project]
name = "mockllm"
version = "0.1.0+2026.10.21"
description = "Poseidon mock LLM: deterministic OpenAI-compatible brain so e2e runs cost nothing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "agent",
    "httpx>=0.27",
    "openai>=1.40",
    "pytest>=8",
]

[tool.uv.sources]
agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mockllm"]
