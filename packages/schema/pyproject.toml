[project]
name = "schema"
version = "0.1.1+2026.10.21"
description = "Poseidon blueprint schema, role-template catalog and crew templates"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.20",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schema"]
