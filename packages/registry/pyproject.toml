[project]
name = "registry"
version = "0.3.0+2026.10.22"
description = "Poseidon registry: Postgres models and write-scoped accessors"
requires-python = ">=3.12"
dependencies = [
    "common",
    "psycopg[binary,pool]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/registry"]
