[project]
name = "gateway"
version = "0.1.0"
description = "Poseidon PoC MCP gateway: tool mux, OPA client, git backend, audit"
requires-python = ">=3.12"
dependencies = [
    "common[otel]",
    "registry",
    "httpx>=0.27",
    "mcp>=1.12",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
