[project]
name = "poseidon-cli"
version = "0.2.1+2026.10.22"
description = "The poseidon CLI and the console client it is built on"
requires-python = ">=3.12"
dependencies = [
    "common",
    "compiler",
    "blueprint",
    "httpx>=0.27",
    "kubernetes>=31",
    "questionary>=2.1",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
poseidon = "poseidon_cli.main:app"

[tool.uv.sources]
common = { workspace = true }
compiler = { workspace = true }
blueprint = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poseidon_cli"]
