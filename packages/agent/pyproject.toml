[project]
name = "agent"
version = "0.1.0"
description = "Poseidon PoC backend-engineer agent: FastAPI app + LangGraph loop"
requires-python = ">=3.12"
dependencies = [
    "common",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=0.2",
    "mcp>=1.12",
    "openai>=1.40",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
