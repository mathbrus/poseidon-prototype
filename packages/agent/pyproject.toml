[project]
name = "agent"
version = "0.1.1+2026.10.21"
description = "Poseidon agent host: the dispatch HTTP API + OpenHands Agent SDK loop behind Hands"
requires-python = ">=3.12"
dependencies = [
    "common[otel]",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=1.12",
    "openhands-sdk==1.56.0",
    "schema",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
