[project]
name = "compiler"
version = "0.3.0+2026.10.22"
description = "Poseidon compiler: blueprint + catalog + registry snapshot -> deployment plan"
requires-python = ">=3.12"
dependencies = [
    "common",
    "blueprint",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compiler"]
