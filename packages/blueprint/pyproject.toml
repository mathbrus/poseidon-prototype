[project]
name = "blueprint"
version = "0.5.2+2026.10.25"
description = "Poseidon blueprint schema, role-template catalog and crew templates"
requires-python = ">=3.12"
dependencies = [
    "common",
    "jsonschema>=4.20",
    "pyyaml>=6",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blueprint"]
