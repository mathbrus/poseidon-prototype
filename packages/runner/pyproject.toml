[project]
name = "runner"
version = "0.1.0"
description = "Poseidon PoC runner CLI: run / status"
requires-python = ">=3.12"
dependencies = [
    "common",
    "sandbox",
    "httpx>=0.27",
    "mcp>=1.12",
    "typer>=0.12",
]

[project.scripts]
poseidon-poc = "runner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runner"]
