[project]
name = "sandbox"
version = "0.1.0"
description = "Poseidon PoC sandbox: backend contract, Docker backend, tool server"
requires-python = ">=3.12"
dependencies = [
    "common",
    "docker>=7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox"]
