[project]
name = "sandbox"
version = "0.1.0"
description = "Poseidon sandbox: backend contract, k8s_jobs backend, tool server, egress proxy"
requires-python = ">=3.12"
dependencies = [
    "common",
    "fastapi>=0.115",
    "kubernetes>=31",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# The egress proxy writes audit events to the registry. Kept an extra so
# the *sandbox* image — which runs untrusted workspace code — never carries
# a database driver or registry credentials. The egress proxy is a platform
# service, so it also gets the OTel extra (the toolserver image does not).
egress = [
    "registry",
    "common[otel]",
]

# The OpenShell evaluation track (plan step 24, O-5): strictly non-gating,
# pinned exactly, and an extra so it never rides into the sandbox image or
# the MVP critical path.
openshell = [
    "openshell==0.0.99",
]

# The prebaked in-sandbox toolchain (Dockerfile.sandbox): the test runner
# the toolserver's /tests endpoint shells out to, lockfile-pinned like
# everything else in the image.
toolchain = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox"]
