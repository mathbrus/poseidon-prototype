[project]
name = "sandbox"
version = "0.5.0+2026.10.25"
description = "Poseidon sandbox: backend contract, k8s_jobs backend, tool server, egress proxy"
requires-python = ">=3.12"
dependencies = [
    "common",
    "fastapi>=0.115",
    "kubernetes>=31",
    "pydantic-settings>=2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# The egress proxy writes audit events to the registry. Kept an extra so
# the *sandbox* image — which runs untrusted workspace code — never carries
# a database driver or registry credentials. The egress proxy is a platform
# service, so it also gets the OTel extra (the toolserver image does not).
egress = [
    "common[otel]",
    "registry",
]

# The prebaked in-sandbox toolchain (the `poseidon-sandbox` image): the test runner
# the toolserver's /tests endpoint shells out to, lockfile-pinned like
# everything else in the image.
toolchain = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox"]
