[project]
name = "console"
version = "0.5.3+2026.10.27"
description = "Poseidon console: the human's chokepoint — verify the person, ask policy, act, audit"
requires-python = ">=3.12"
dependencies = [
    "common[otel]",
    "registry",
    "blueprint",
    "compiler",
    "fastapi>=0.115",
    "httpx>=0.27",
    "kubernetes>=31",
    "mcp>=1.12",
    "pyyaml>=6",
    "temporalio>=1.31",
    "uvicorn>=0.30",
]

[tool.uv.sources]
common = { workspace = true }
registry = { workspace = true }
blueprint = { workspace = true }
compiler = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/console"]
