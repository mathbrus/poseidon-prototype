[project]
name = "poseidon-operator"
version = "0.1.0+2026.10.21"
description = "Poseidon operator: reconciles Company/AgentInstance CRs and serves compiled policy bundles"
requires-python = ">=3.12"
dependencies = [
    "common[otel]",
    "registry",
    "kopf>=1.37",
    "kubernetes>=31",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poseidon_operator"]
