[project]
name = "orchestrator"
version = "0.1.0"
description = "Poseidon orchestrator: durable workflows (Temporal), activities, gates, worker, poseidon CLI"
requires-python = ">=3.12"
dependencies = [
    "common",
    "registry",
    "compiler",
    "schema",
    "sandbox",
    "httpx>=0.27",
    "mcp>=1.12",
    "temporalio>=1.31",
    "typer>=0.12",
]

[project.scripts]
poseidon = "orchestrator.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]
