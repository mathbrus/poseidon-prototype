[project]
name = "orchestrator"
version = "0.2.1+2026.10.22"
description = "Poseidon orchestrator: durable workflows (Temporal), activities, gates, worker"
requires-python = ">=3.12"
dependencies = [
    "common[otel]",
    "registry",
    "blueprint",
    "sandbox",
    "httpx>=0.27",
    "mcp>=1.12",
    "temporalio>=1.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]
