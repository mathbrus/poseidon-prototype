[project]
name = "mock-brain"
version = "0.2.1+2026.10.22"
description = "Poseidon mock LLM: deterministic OpenAI-compatible brain so e2e runs cost nothing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "agent-host",
    "httpx>=0.27",
    "openai>=1.40",
    "pytest>=8",
]

[tool.uv.sources]
agent-host = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_brain"]
