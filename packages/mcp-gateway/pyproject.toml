[project]
name = "mcp-gateway"
version = "0.5.2+2026.10.25"
description = "Poseidon MCP gateway: tool mux, OPA client, git backend, audit"
requires-python = ">=3.12"
dependencies = [
    "common[otel]",
    "registry",
    "blueprint",
    "httpx>=0.27",
    "mcp>=1.12",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway"]
