[project]
name = "llm-gateway"
version = "0.4.0+2026.10.22"
description = "Poseidon LLM gateway: workload-authenticated, metered, model-pinning model access"
requires-python = ">=3.12"
dependencies = [
    "common[otel]",
    "registry",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[tool.uv.sources]
common = { workspace = true }
registry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]
