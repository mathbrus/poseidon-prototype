[project]
name = "gateway-llm"
version = "0.2.0"
description = "Poseidon LLM gateway: workload-authenticated, metered, tier-routing model access"
requires-python = ">=3.12"
dependencies = [
    "common[otel]",
    "registry",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[tool.uv.sources]
common = { workspace = true }
registry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_llm"]
