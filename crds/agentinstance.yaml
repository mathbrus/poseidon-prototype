# The `AgentInstance` custom resource: one standing hire.
#
# Standing structure only — created, changed and removed by blueprint apply
# and nothing else. Ephemeral crew members never appear here:
# they live in the registry's `run_participants` for the length of one run,
# which is what keeps hire/fire diffs clean.
#
# Carries no secret. The spec is a role, a tier and a tool scope; credentials
# reach the pod at runtime as projected tokens.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentinstances.poseidon.dev
spec:
  group: poseidon.dev
  scope: Namespaced
  names:
    kind: AgentInstance
    plural: agentinstances
    singular: agentinstance
    shortNames: [ai]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Company
          type: string
          jsonPath: .spec.company
        - name: Template
          type: string
          jsonPath: .spec.roleTemplate
        - name: Tier
          type: string
          jsonPath: .spec.modelTier
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [agentId, company, hire, roleTemplate]
              properties:
                agentId: {type: string}
                company: {type: string}
                hire: {type: string}
                roleTemplate: {type: string}
                modelTier: {type: string}
                tools:
                  type: array
                  items: {type: string}
                maySpawn:
                  type: array
                  items: {type: string}
                maxConcurrentSpawns: {type: integer}
                runtimeHints:
                  type: object
                  additionalProperties: {type: string}
            status:
              type: object
              properties:
                phase: {type: string}
                message: {type: string}
