# The `AgentInstance` custom resource: one standing agent.
#
# Standing structure only — created, changed and removed by blueprint apply
# and nothing else. Ephemeral agents never appear here:
# they live in the registry's `run_participants` for the length of one run,
# which is what keeps hire/fire diffs clean.
#
# Carries no secret. The spec is a name, a role, a tier and a tool scope;
# credentials reach the pod at runtime as projected tokens.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentinstances.poseidon.dev
spec:
  group: poseidon.dev
  scope: Namespaced
  names:
    kind: AgentInstance
    plural: agentinstances
    singular: agentinstance
    shortNames: [ai]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Company
          type: string
          jsonPath: .spec.company
        - name: Role
          type: string
          jsonPath: .spec.role
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [agentId, company, standingName, role, repo, mission]
              properties:
                agentId: {type: string}
                company: {type: string}
                # The hire's name in the blueprint's `standing:` section.
                standingName: {type: string}
                # The catalog role.
                role: {type: string}
                # What the pod is told about its company; an edit to either
                # rolls the pod.
                repo:
                  type: object
                  required: [url, base_ref]
                  properties:
                    url: {type: string}
                    base_ref: {type: string}
                mission: {type: string}
                tools:
                  type: array
                  items: {type: string}
                maySpawn:
                  type: array
                  items: {type: string}
            status:
              type: object
              properties:
                phase: {type: string}
                message: {type: string}
