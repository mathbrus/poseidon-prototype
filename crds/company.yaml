# The `Company` custom resource: one per compiled blueprint.
#
# Holds the parts of a deployment plan that are company-wide — the namespace
# envelope, the infra IR projections, workflow gate config, budgets — plus
# the compiled policy bundle's revision. The reconciler converges it into a
# namespace, NetworkPolicies and a served bundle; it never runs processes
# and never creates ephemeral agents.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: companies.poseidon.dev
spec:
  group: poseidon.dev
  scope: Cluster
  names:
    kind: Company
    plural: companies
    singular: company
    shortNames: [co]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Namespace
          type: string
          jsonPath: .spec.namespace
        - name: Bundle
          type: string
          jsonPath: .status.bundleRevision
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [namespace]
              properties:
                namespace: {type: string}
                vision: {type: string}
                # The company's subject: the repository every run works on
                # and the branch changes are diffed and delivered against.
                repo:
                  type: object
                  required: [url, base_ref]
                  properties:
                    url: {type: string}
                    base_ref: {type: string}
                # The company's two document paths in that repository:
                # read at base_ref before every tick and every run.
                documents:
                  type: object
                  required: [strategy, architecture]
                  properties:
                    strategy: {type: string}
                    architecture: {type: string}
                # The compiled Rego bundle, filename -> source. The reconciler
                # persists it and serves it over the standard OPA bundle
                # API; OPA polls. No runtime data pushes.
                policyBundle:
                  type: object
                  additionalProperties: {type: string}
                # The platform scope's own bundle: compiler-
                # owned, company-independent, served under the reserved
                # "platform" key. Identical from every apply.
                platformBundle:
                  type: object
                  additionalProperties: {type: string}
                # Infra IR projections.
                infra:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                workflows:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                budgets:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                # The company's own initiative: its conductor, cadence and
                # caps. Every company has one; the worker keeps
                # `heartbeat-<company>` running from it.
                heartbeat:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                # The blueprint's `policies` section as written: branch
                # protection, deny paths, the contract tree. The bundle
                # enforces it; the platform reads it here to render the
                # bounds every dispatch carries and to compose the
                # contract-verify baseline.
                policies:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                ephemeralAgents:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                phase: {type: string}
                bundleRevision: {type: string}
                observedGeneration: {type: integer}
                message: {type: string}
