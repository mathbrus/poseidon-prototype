# Poseidon CI (plan step 6): unit tests, policy tests, lockfile-pinned image
# builds, and the secret-inspection gate that proves invariant #1 by
# inspection — no *_TOKEN/*_KEY other than AGENT_BEARER_TOKEN may be baked
# into the agent or sandbox images.
#
# The kind e2e suite (E1–E4 + kill-the-worker) opens real PRs on a
# disposable repo, so it stays manually dispatched. It spends no LLM tokens:
# the cluster deploys the deterministic mock brain by default.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run the kind e2e suite (needs the E2E_* repository secrets)"
        type: boolean
        default: false

jobs:
  unit:
    runs-on: ubuntu-latest
    # The registry suite tests SQL, so it runs against a real Postgres —
    # a fake would test nothing. Without REGISTRY_DSN it skips instead of
    # failing, which is what keeps a laptop run green.
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: poseidon
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: poseidon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U poseidon"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REGISTRY_DSN: postgresql://poseidon:ci@127.0.0.1:5432/poseidon
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      # Per package: the suites share fixture module names (conftest.py),
      # which collide in a single rootdir-wide collection.
      - run: |
          for package in common gateway agent sandbox orchestrator mockllm schema registry compiler operator; do
            echo "::group::$package"
            uv run pytest "packages/$package" -q
            echo "::endgroup::"
          done

  opa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Hand-authored policy (retires at plan step 12)
        run: docker run --rm -v "$PWD/policies:/policies:ro" openpolicyagent/opa test /policies -v
      - name: Compiled bundle parses
        run: |
          uv run poseidon blueprint compile examples/hello-saas.yaml \
            --no-live --out compiled-bundle >/dev/null
          docker run --rm -v "$PWD/compiled-bundle:/b:ro" openpolicyagent/opa check /b

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build images
        run: |
          for image in gateway agent sandbox orchestrator egressproxy mockllm operator; do
            docker build -f "Dockerfile.$image" -t "poseidon-$image" .
          done

      - name: "Lockfile pinning: images resolve the locked versions"
        run: |
          # `uv export` in the build means an image can only carry what
          # uv.lock resolves; spot-check the dependency that bit us at step 3.
          locked=$(python -c "
          import tomllib, pathlib
          lock = tomllib.loads(pathlib.Path('uv.lock').read_text())
          print(next(p['version'] for p in lock['package'] if p['name'] == 'mcp'))
          ")
          in_image=$(docker run --rm poseidon-orchestrator \
            python -c "import importlib.metadata as m; print(m.version('mcp'))")
          if [ "$locked" != "$in_image" ]; then
            echo "image resolved mcp $in_image, uv.lock pins $locked" >&2
            exit 1
          fi

      - name: "Secret-inspection gate: agent and sandbox image layers"
        run: |
          # GPG_KEY is the python base image's public release-signing key
          # fingerprint — not a credential — and cannot be removed from the
          # inherited layer history; everything else *_TOKEN/*_KEY fails.
          for image in poseidon-agent poseidon-sandbox; do
            leaked=$( (docker history --no-trunc --format '{{.CreatedBy}}' "$image"; \
                       docker inspect --format '{{join .Config.Env "\n"}}' "$image") \
              | grep -oE '[A-Za-z_]*_(TOKEN|KEY)=' | sort -u \
              | grep -vE '^(AGENT_BEARER_TOKEN|GPG_KEY)=$' || true)
            if [ -n "$leaked" ]; then
              echo "secret-shaped variables baked into $image: $leaked" >&2
              exit 1
            fi
          done

  e2e-kind:
    # Manual and optional: brings up a kind cluster and opens real PRs on a
    # disposable repo. No LLM spend — the stack deploys the mock brain.
    # Requires the E2E_GIT_TOKEN / E2E_TARGET_REPO repository secrets.
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Bring the cluster up
        env:
          GIT_TOKEN: ${{ secrets.E2E_GIT_TOKEN }}
          TARGET_REPO: ${{ secrets.E2E_TARGET_REPO }}
        run: |
          install -m 600 /dev/null deploy/kind/.env
          cat >> deploy/kind/.env <<EOF
          GIT_TOKEN=${GIT_TOKEN}
          TARGET_REPO=${TARGET_REPO}
          BASE_REF=main
          MAX_ITERATIONS=10
          MCP_GATEWAY_URL=http://127.0.0.1:8080
          EOF
          deploy/kind/kind-up.sh
      - run: uv run pytest tests/e2e_kind -m e2e_kind -v
      - name: Tear the cluster down
        if: always()
        run: deploy/kind/kind-down.sh
