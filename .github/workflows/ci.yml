# Poseidon CI: lint, unit tests, lockfile and dependency checks, chart
# rendering, policy tests, the docs site, lockfile-pinned image builds, and the
# secret-inspection gate that proves invariant #1 by inspection — no
# *_TOKEN/*_KEY may be baked into the agent or sandbox images.
#
# The kind e2e suite opens real PRs on a disposable repo, so it stays
# manually dispatched. It spends no LLM tokens: the cluster deploys the
# deterministic mock brain.

name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run the kind e2e suite (needs the E2E_* repository secrets)"
        type: boolean
        default: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # The images build with `uv export --frozen`, so a stale lockfile
      # means the images and the host resolve different versions.
      - name: Lockfile is current
        run: uv lock --check
      - run: uv sync
      # Advisory: a fresh CVE in a transitive dependency should be visible
      # on every run without failing an unrelated change.
      - name: "Dependency audit (advisory)"
        continue-on-error: true
        run: |
          # --no-header because pip-audit rejects uv's leading comment.
          uv export --frozen --no-emit-workspace --no-hashes --no-header \
            -o requirements-audit.txt
          uv run pip-audit -r requirements-audit.txt

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Secrets are `required` in the templates, so rendering needs values
      # for them; these are throwaway strings, never a real credential.
      - name: Lint and render the chart
        run: |
          secrets=(
            --set secrets.gitToken=ci
            --set secrets.llmApiKey=ci
            --set secrets.postgresPassword=ci
            --set secrets.egressProxyKey=ci
          )
          helm lint deploy/helm/poseidon "${secrets[@]}"
          helm template deploy/helm/poseidon "${secrets[@]}" >/dev/null
          helm template deploy/helm/poseidon "${secrets[@]}" \
            -f deploy/helm/poseidon/values-kind.yaml >/dev/null
      - uses: astral-sh/setup-uv@v5
      - name: "The chart's ports and token audience equal common.topology"
        run: |
          helm template deploy/helm/poseidon --set secrets.gitToken=ci \
            --set secrets.llmApiKey=ci --set secrets.postgresPassword=ci \
            --set secrets.egressProxyKey=ci > /tmp/rendered.yaml
          uv run --package common --with pyyaml python - <<'PY'
          import yaml
          from common import topology as t
          docs = [d for d in yaml.safe_load_all(open("/tmp/rendered.yaml")) if d]
          ports = {d["metadata"]["name"]: d["spec"]["ports"][0]["port"]
                   for d in docs if d["kind"] == "Service"}
          for name, port in {t.MCP_GATEWAY: t.MCP_GATEWAY_PORT, t.LLM_GATEWAY: t.LLM_GATEWAY_PORT,
                             t.EGRESS_PROXY: t.EGRESS_PROXY_PORT, t.OPA: t.OPA_PORT,
                             t.BUNDLE_SERVER: t.BUNDLE_PORT}.items():
              assert ports[name] == port, (name, ports[name], port)
          worker = next(d for d in docs if d["kind"] == "Deployment" and d["metadata"]["name"] == t.ORCHESTRATOR_SERVICE_ACCOUNT)
          token = worker["spec"]["template"]["spec"]["volumes"][0]["projected"]["sources"][0]["serviceAccountToken"]
          assert token["audience"] == t.TOKEN_AUDIENCE and token["expirationSeconds"] == t.TOKEN_TTL_S, token
          print("chart agrees with common.topology")
          PY
      - name: "A bare install must not deploy placeholder credentials"
        run: |
          if helm template deploy/helm/poseidon >/dev/null 2>&1; then
            echo "the chart rendered without secret overrides" >&2
            exit 1
          fi

  unit:
    runs-on: ubuntu-latest
    # The registry suite tests SQL, so it runs against a real Postgres —
    # a fake would test nothing. Without REGISTRY_DSN it skips instead of
    # failing, which is what keeps a laptop run green.
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: poseidon
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: poseidon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U poseidon"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REGISTRY_DSN: postgresql://poseidon:ci@127.0.0.1:5432/poseidon
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      # Per package: the suites share fixture module names (conftest.py),
      # which collide in a single rootdir-wide collection. Discovered from
      # the workspace so a new package cannot be silently untested.
      - run: |
          for package in packages/*/; do
            echo "::group::$package"
            uv run pytest "$package" -q
            echo "::endgroup::"
          done

  opa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Compiled bundle parses
        run: |
          uv run poseidon blueprint compile examples/hello-saas.yaml \
            --no-live --out compiled-bundle >/dev/null
          # Pinned to the tag the chart deploys, so CI checks the bundle
          # against the OPA that will actually load it.
          docker run --rm -v "$PWD/compiled-bundle:/b:ro" \
            openpolicyagent/opa:1.19.0 check /b

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      # The image matrix is deploy/build-images.sh: a new image is built
      # and inspected without anyone remembering to add it here.
      - name: Build images
        run: |
          for image in $(deploy/build-images.sh --list); do
            echo "::group::$image"
            deploy/build-images.sh ci "$image"
            echo "::endgroup::"
          done

      - name: "Lockfile pinning: images resolve the locked versions"
        run: |
          # `uv export` in the build means an image can only carry what
          # uv.lock resolves; spot-check a dependency that has bitten us.
          locked=$(uv run python -c "
          import tomllib, pathlib
          lock = tomllib.loads(pathlib.Path('uv.lock').read_text())
          print(next(p['version'] for p in lock['package'] if p['name'] == 'mcp'))
          ")
          in_image=$(docker run --rm --entrypoint python poseidon-orchestrator:ci \
            -c "import importlib.metadata as m; print(m.version('mcp'))")
          if [ "$locked" != "$in_image" ]; then
            echo "image resolved mcp $in_image, uv.lock pins $locked" >&2
            exit 1
          fi

      - name: "Secret-inspection gate: agent and sandbox image layers"
        run: |
          # GPG_KEY is the python base image's public release-signing key
          # fingerprint — not a credential — and cannot be removed from the
          # inherited layer history; everything else *_TOKEN/*_KEY fails.
          for image in poseidon-agent:ci poseidon-sandbox:ci; do
            leaked=$( (docker history --no-trunc --format '{{.CreatedBy}}' "$image"; \
                       docker inspect --format '{{join .Config.Env "\n"}}' "$image") \
              | grep -oE '[A-Za-z_]*_(TOKEN|KEY)=' | sort -u \
              | grep -vE '^GPG_KEY=$' || true)
            if [ -n "$leaked" ]; then
              echo "secret-shaped variables baked into $image: $leaked" >&2
              exit 1
            fi
          done

      - name: "Images run as a non-root user"
        run: |
          for image in $(deploy/build-images.sh --list); do
            uid=$(docker inspect --format '{{.Config.User}}' "$image:ci")
            if [ "$uid" != "10001" ]; then
              echo "$image runs as '${uid:-root}', expected 10001" >&2
              exit 1
            fi
          done

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group docs
      # mkdocs.yml sets strict: a broken link, an orphaned page or a
      # reference page that does not match the code fails the build.
      - run: uv run mkdocs build
      # The repository is private, so there is no Pages deployment yet;
      # the built site is the artifact of every run.
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/

  e2e-kind:
    # Manual and optional: brings up a kind cluster and opens real PRs on a
    # disposable repo. No LLM spend — the stack deploys the mock brain
    # (nothing here sets REAL_LLM).
    # Requires the E2E_GIT_TOKEN / E2E_TARGET_REPO repository secrets.
    #
    # This job IS the acceptance suite — scripts/acceptance.sh, exactly as
    # it runs locally: the paid-brain preflight, then tests/e2e_kind in full.
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Bring the cluster up
        env:
          GIT_TOKEN: ${{ secrets.E2E_GIT_TOKEN }}
          TARGET_REPO: ${{ secrets.E2E_TARGET_REPO }}
        run: |
          install -m 600 /dev/null deploy/kind/.env
          cat >> deploy/kind/.env <<EOF
          GIT_TOKEN=${GIT_TOKEN}
          TARGET_REPO=${TARGET_REPO}
          MCP_GATEWAY_URL=http://127.0.0.1:8080
          EOF
          deploy/kind/kind-up.sh
      - run: scripts/acceptance.sh -v
      - name: Tear the cluster down
        if: always()
        run: deploy/kind/kind-down.sh
