[project]
name = "poseidon-poc"
version = "0.1.0"
description = "Poseidon PoC — one agent ships one PR under policy"
requires-python = ">=3.12"
dependencies = [
    "common",
    "agent",
    "gateway",
    "sandbox",
    "runner",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
markers = [
    "docker: integration tests needing a Docker daemon (run with -m docker)",
]
# Excluded by default; an explicit `-m docker` on the command line overrides this.
addopts = "-m 'not docker'"

[tool.uv.sources]
common = { workspace = true }
agent = { workspace = true }
gateway = { workspace = true }
sandbox = { workspace = true }
runner = { workspace = true }
