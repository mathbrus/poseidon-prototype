[project]
name = "poseidon-poc"
version = "0.1.0"
description = "Poseidon PoC — one agent ships one PR under policy"
requires-python = ">=3.12"
dependencies = [
    "common",
    "agent",
    "gateway",
    "sandbox",
    "runner",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "temporalio>=1.31.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
markers = [
    "docker: integration tests needing a Docker daemon (run with -m docker)",
    "e2e: end-to-end tests needing the live compose stack, a real repo and a real LLM key (run with -m e2e)",
    "e2e_kind: end-to-end tests needing the live kind cluster, a real repo and a real LLM key (run with -m e2e_kind)",
]
# Excluded by default; an explicit `-m docker` / `-m e2e` / `-m e2e_kind` on
# the command line overrides this.
addopts = "-m 'not docker and not e2e and not e2e_kind'"

[tool.uv.sources]
common = { workspace = true }
agent = { workspace = true }
gateway = { workspace = true }
sandbox = { workspace = true }
runner = { workspace = true }
